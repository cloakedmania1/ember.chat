:root{
  --bg:#12100f; --bg2:#1a1614; --panel:#221c19; --line:#332a25;
  --txt:#efe6dd; --dim:#9d8f83; --dim2:#6f6459;
  --ember:#ff9a2e; --ember2:#ffc46b; --on:#1a1005;
  --cool:#7ad3ff; --pink:#ff6ba8; --good:#8fe388;
  --sans:'Instrument Sans',system-ui,sans-serif;
  --disp:'Bricolage Grotesque',var(--sans);
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --row:15px; --rad:8px;
}
/* ══ MSN / Windows XP Luna teması ══ */
body.msn{
  --bg:#eef1f6; --bg2:#f4f3ee; --panel:#fff; --line:#aca899;
  --txt:#000; --dim:#3b3b3b; --dim2:#6b6857;
  --ember:#316ac5; --ember2:#0a246a; --on:#fff;
  --cool:#0645ad; --good:#2e7d32;
  --sans:'Trebuchet MS',Tahoma,Verdana,sans-serif;
  --disp:'Trebuchet MS',Tahoma,sans-serif;
  --mono:Tahoma,Verdana,sans-serif;
  --row:12px; --rad:3px;
  background:#5a7edc;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;overflow:hidden}
body{position:fixed;left:0;right:0;top:0;height:100%;height:100dvh;
  margin:0;overflow:hidden;overscroll-behavior:none}
body{
  background:var(--bg);color:var(--txt);font-family:var(--sans);
  display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);
}
body.msn{padding:6px;gap:0}

/* ── pencere gövdesi ─────────────────────── */
#win{display:flex;flex-direction:column;flex:1 1 auto;min-height:0;max-height:100%}
body.msn #win{
  border:1px solid #0831d9;border-radius:8px 8px 4px 4px;overflow:hidden;
  box-shadow:0 8px 26px rgba(0,0,0,.45);background:var(--bg);
}

/* ── başlık çubuğu ───────────────────────── */
.top{display:flex;gap:8px;align-items:center;padding:10px 12px;
  background:linear-gradient(180deg,#1d1815,#161211);border-bottom:1px solid var(--line);flex:0 0 auto}
body.msn .top{padding:3px 4px 3px 7px;gap:5px;border-bottom:1px solid #0831d9}
.mark{font-family:var(--disp);font-weight:800;font-size:17px;letter-spacing:-.02em;white-space:nowrap}
.mark i{font-style:normal;color:var(--ember)}
body.msn .mark{color:#fff;font-size:13px;font-weight:700;text-shadow:1px 1px 1px rgba(0,0,0,.55)}
body.msn .mark i{color:#7ec0ee}
input,button{font-family:var(--sans);font-size:14px}
#chan{flex:1 1 80px;min-width:0;background:#0e0c0b;border:1px solid var(--line);color:var(--txt);
  padding:9px 11px;border-radius:var(--rad);font-weight:500}
#chan:focus{outline:2px solid var(--ember);outline-offset:-1px}
body.msn #chan{background:#fff;color:#000;border:1px solid #7f9db9;padding:3px 6px;font-size:12px;border-radius:2px}
#go{background:var(--ember);color:var(--on);border:0;border-radius:var(--rad);padding:9px 16px;
  font-weight:600;cursor:pointer;white-space:nowrap}
#go.on{background:var(--panel);color:var(--dim);border:1px solid var(--line)}
body.msn #go,body.msn #go.on{
  background:linear-gradient(180deg,#fdfdfd,#eceade 45%,#dcd8c4);color:#000;
  border:1px solid #7f9db9;border-radius:3px;padding:3px 10px;font-size:12px;font-weight:400;
}
.wbtn{display:none}
body.msn .wbtn{
  display:inline-flex;align-items:center;justify-content:center;width:19px;height:17px;margin-left:1px;
  border:1px solid #fff;border-radius:3px;background:linear-gradient(180deg,#5b9bf0,#1256cf);
  color:#fff;font-family:var(--sans);font-size:11px;font-weight:700;line-height:1;cursor:pointer;padding:0;
}
body.msn .wbtn.x{background:linear-gradient(180deg,#f08e6a,#d8481f);border-color:#fff}

/* ── araç çubuğu ─────────────────────────── */
#toolsWrap{display:flex;align-items:stretch;flex:0 0 auto;min-width:0;
  border-bottom:1px solid var(--line);background:var(--bg2)}
#tools{display:flex;gap:6px;padding:7px 10px;background:transparent;
  flex:1 1 auto;min-width:0;overflow-x:auto;scrollbar-width:none}
#tools::-webkit-scrollbar{display:none}
.tool{display:flex;flex-direction:column;align-items:center;gap:2px;white-space:nowrap;
  background:transparent;border:1px solid transparent;border-radius:var(--rad);
  color:var(--dim);font-size:10.5px;padding:5px 9px;cursor:pointer;min-width:52px}
.tool .ic{font-size:17px;line-height:1}
.tool:hover{color:var(--txt);background:rgba(255,255,255,.05)}
.tool.on{color:var(--ember2);border-color:rgba(255,154,46,.35);background:rgba(255,154,46,.08)}
body.msn #toolsWrap{border-bottom:1px solid #7f9db9;height:50px}
body.msn #tools{background:transparent;padding:2px 4px;gap:0;align-items:center}
body.msn .tool{color:#0a2a5e;font-size:10px;border-radius:3px}
body.msn .tool:hover{background:rgba(255,255,255,.65);border-color:#8fb6e3}
body.msn .tool.on{background:rgba(255,255,255,.9);border-color:#7f9db9;color:#0a2a5e;
  box-shadow:inset 0 1px 3px rgba(80,110,160,.35)}

/* ── ayar çekmecesi ──────────────────────── */
#drawer{display:none;padding:12px;background:var(--bg2);border-bottom:1px solid var(--line);flex:0 0 auto;
  max-height:52vh;overflow:auto}
#drawer.open{display:block}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:9px}
.field label{font-size:11px;color:var(--dim);letter-spacing:.04em;text-transform:uppercase}
.field input{background:#0e0c0b;border:1px solid var(--line);color:var(--txt);padding:8px 10px;border-radius:var(--rad)}
body.msn .field input{background:#fff;border:1px solid #7f9db9;color:#000}
.hint{font-size:11.5px;color:var(--dim2);line-height:1.5;margin:6px 0 0}
.hint a{color:var(--cool)}
.drow{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.mini{background:var(--panel);border:1px solid var(--line);color:var(--txt);
  border-radius:var(--rad);padding:8px 13px;cursor:pointer;font-weight:600;font-size:13px}
.mini.key{background:var(--ember);color:var(--on);border-color:transparent}
body.msn .mini,body.msn .mini.key{
  background:linear-gradient(180deg,#fdfdfd,#eceade 45%,#dcd8c4);color:#000;
  border:1px solid #7f9db9;font-weight:400;padding:4px 12px;border-radius:3px}
.mini:disabled{opacity:.45;cursor:default}
#tokstat{font-size:12px;color:var(--dim2);flex:1 1 140px;min-width:0}
#tokstat.ok{color:var(--good)} #tokstat.bad{color:#d33}
#tokstat b{color:var(--txt);font-weight:600}
.sw{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
select{font-family:var(--sans);font-size:13.5px;background:#0e0c0b;border:1px solid var(--line);
  color:var(--txt);padding:8px 10px;border-radius:var(--rad);flex:1 1 150px;min-width:0}
body.msn select{background:#fff;border:1px solid #7f9db9;color:#000;border-radius:2px;padding:4px 6px}
#fontPrev{margin-top:6px;padding:9px 11px;border:1px solid var(--line);border-radius:var(--rad);
  background:var(--panel);font-size:calc(var(--row)*var(--fs,1))}
body.msn #fontPrev{background:#fff;border:1px solid #7f9db9;border-radius:2px}
#fontPrev b{color:var(--ember2)}
.sw button{width:24px;height:24px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.sw button[aria-pressed="true"]{border-color:var(--txt)}
.sw input[type=color]{width:28px;height:28px;padding:0;border:1px solid var(--line);border-radius:50%;
  background:none;cursor:pointer;overflow:hidden}
.sw input[type=color]::-webkit-color-swatch{border:none;border-radius:50%}

/* ── gövde: kenar çubuğu + sohbet ────────── */
#body{display:flex;flex:1 1 auto;min-height:0}
#body{position:relative}
#side{
  position:absolute;left:0;top:0;bottom:0;z-index:17;width:min(82vw,290px);
  transform:translateX(-101%);visibility:hidden;transition:transform .22s ease,visibility .22s;
  background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;
  box-shadow:7px 0 28px rgba(0,0,0,.45);will-change:transform;
}
#side.open{transform:none;visibility:visible}
body.msn #side{background:#fff;border-right:1px solid #aca899}
.sh{
  padding:8px 10px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);
  border-bottom:1px solid var(--line);flex:0 0 auto;
}
body.msn .sh{
  text-transform:none;letter-spacing:0;font-size:12px;font-weight:700;color:#003399;
  background:linear-gradient(180deg,#eaf2fd,#d3e3f8);border-bottom:1px solid #a9c4e4;
}
#chanlist{flex:1 1 auto;overflow:auto;padding:5px 0}
.cw{display:flex;align-items:center;gap:8px;padding:7px 10px;cursor:pointer;font-size:13.5px;color:var(--txt)}
.cw:hover{background:rgba(255,255,255,.06)}
body.msn .cw:hover{background:#e2ecf9}
.cw.live{font-weight:700}
.cw .dot{width:9px;height:9px;border-radius:50%;background:var(--dim2);flex:0 0 auto}
.cw.live .dot{background:var(--good);box-shadow:0 0 8px var(--good)}
body.msn .cw .dot{display:none}
.cw .bud{display:none}
body.msn .cw .bud{display:block;width:16px;height:16px;flex:0 0 auto}
.cw .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cw .del{color:var(--dim2);font-size:15px;padding:0 4px;background:none;border:0;cursor:pointer}
.cw .del:hover{color:#e05}
.sf{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line);flex:0 0 auto}
.sf input{flex:1;min-width:0;background:#0e0c0b;border:1px solid var(--line);color:var(--txt);
  padding:7px 9px;border-radius:var(--rad);font-size:13px}
body.msn .sf input{background:#fff;border:1px solid #7f9db9;color:#000}
.sf button{background:var(--ember);color:var(--on);border:0;border-radius:var(--rad);padding:7px 12px;
  font-weight:700;cursor:pointer}
body.msn .sf button{background:linear-gradient(180deg,#fdfdfd,#eceade 45%,#dcd8c4);color:#000;border:1px solid #7f9db9}
#pane{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}

/* ── emote hava durumu ───────────────────── */
#weather{flex:0 0 auto;height:62px;position:relative;overflow:hidden;border-bottom:1px solid var(--line);
  background:radial-gradient(120% 140% at 50% 130%, rgba(255,154,46,var(--heat,0)) 0%, transparent 70%), #161211;
  transition:background .8s linear}
body.msn #weather{background:#fff;border:1px solid #7f9db9;margin:5px;height:56px;border-radius:2px}
#weather.hide{display:none}
#weather .none{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:11px;color:var(--dim2);letter-spacing:.1em}
#wrow{display:flex;align-items:center;justify-content:center;gap:14px;height:100%;padding:0 10px}
.wq{display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.wq img{display:block;filter:drop-shadow(0 2px 6px rgba(0,0,0,.45))}
.wq b{font-family:var(--mono);font-size:9.5px;color:var(--ember2);font-weight:600;margin-top:2px}
#hype{position:absolute;left:0;bottom:0;height:2px;background:var(--ember);width:0;transition:width .6s ease}

/* ── sohbet ──────────────────────────────── */
#chat{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:10px 0 14px;
  font-size:calc(var(--row)*var(--fs,1));line-height:1.45;scrollbar-width:thin;scrollbar-color:#3a302a transparent}
body.msn #chat{background:#fff;border:1px solid #7f9db9;margin:0 5px;border-radius:2px;
  scrollbar-color:#c3d5ea #f1f1f1}
#chat::-webkit-scrollbar{width:9px}
#chat::-webkit-scrollbar-thumb{background:#3a302a;border-radius:4px}
body.msn #chat::-webkit-scrollbar-thumb{background:linear-gradient(90deg,#eaf2fd,#a8c8ec);border:1px solid #7f9db9;border-radius:2px}
.msg{padding:4px 14px;word-wrap:break-word;position:relative;animation:in .45s ease both}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.msg::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--ember);
  opacity:.55;animation:trace 1.2s ease-out forwards}
@keyframes trace{to{opacity:0}}
body.msn .msg::before{display:none}
body.msn .msg{padding:1px 7px 5px}
.t{font-family:var(--mono);font-size:11px;color:var(--dim2);margin-right:6px}
.u{font-weight:600}
.u::after{content:':';color:var(--dim);font-weight:400}
body.msn .msg .u{display:block;font-weight:700}
body.msn .msg .u::after{content:' ' attr(data-says) ':';color:#666;font-weight:400;font-size:11px}
body.msn .msg .body{display:block;padding-left:16px}
body.msn .msg.action .u::after{content:''}
.msg.action .u::after{content:''}
.msg.action .body{font-style:italic}
.bdg{height:18px;width:auto;vertical-align:-4px;margin-right:3px;image-rendering:auto}
body.msn .bdg{height:16px;vertical-align:-3px}
.badge{display:inline-block;font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.06em;
  padding:1px 4px;border-radius:3px;margin-right:4px;vertical-align:1.5px}
.b-mod{background:#1f4d33;color:#7ee0a8} .b-vip{background:#4a1f3d;color:#ff9fd6}
.b-sub{background:#2b2454;color:#a99cff} .b-brd{background:#5a1f1f;color:#ff9c9c}
.b-fnd{background:#4a3410;color:#ffcb7a}
body.msn .badge{border:1px solid #9aa;background:#f0f0e8;color:#333;font-size:9px}
.emote{height:28px;vertical-align:-8px;margin:-2px 1px;transition:transform .15s}
.emote:hover{transform:scale(1.25)}
.jumbo .emote{height:56px;vertical-align:-18px}
.zw{position:relative;display:inline-block}
.zw .over{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none}
.msg.mention{background:linear-gradient(90deg,rgba(255,154,46,.14),rgba(255,154,46,.02));box-shadow:inset 2px 0 0 var(--ember)}
body.msn .msg.mention{background:#fff8dc;box-shadow:inset 3px 0 0 #f0a800}
.msg.first{background:linear-gradient(90deg,rgba(122,211,255,.12),transparent);box-shadow:inset 2px 0 0 var(--cool)}
body.msn .msg.first{background:#eef6ff;box-shadow:inset 3px 0 0 #316ac5}
.msg.gone .body{opacity:.35;text-decoration:line-through}
a.link{color:var(--cool);text-decoration:none;border-bottom:1px dotted #3f5a66}
body.msn a.link{border-bottom-color:#9bb}
.sys{margin:7px 14px;padding:8px 12px;border-radius:var(--rad);font-size:13.5px;
  background:linear-gradient(90deg,rgba(255,154,46,.13),rgba(255,154,46,.03));border:1px solid rgba(255,154,46,.22)}
body.msn .sys{background:#fffbe6;border:1px solid #e0c060}
.sys.raid{background:linear-gradient(90deg,rgba(255,107,168,.14),transparent);border-color:rgba(255,107,168,.25)}
body.msn .sys.raid{background:#fdeef5;border-color:#e0a0c0}
.sys .who{font-weight:700;color:var(--ember2)}
.info{padding:6px 14px;font-family:var(--mono);font-size:11.5px;color:var(--dim2)}
body.msn .info{background:#f6f6f0;border-top:1px solid #e5e2d5;border-bottom:1px solid #e5e2d5;
  padding:4px 10px;font-size:11px;font-style:italic}
.info.err{color:#d33}
#pill{position:absolute;left:50%;transform:translateX(-50%);bottom:96px;z-index:14;
  background:var(--ember);color:var(--on);font-weight:600;font-size:12.5px;padding:7px 14px;
  border-radius:20px;cursor:pointer;display:none;box-shadow:0 6px 22px rgba(0,0,0,.55)}

/* ── yazma alanı ─────────────────────────── */
.foot{flex:0 0 auto;border-top:1px solid var(--line);background:#161211;padding:8px 10px;position:relative}
body.msn .foot{background:var(--bg);border-top:1px solid #aca899;padding:5px}
.modes{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:7px}
.mode{font-family:var(--mono);font-size:10px;letter-spacing:.05em;color:var(--dim);
  border:1px solid var(--line);padding:2px 7px;border-radius:20px}
.mode.on{color:var(--ember2);border-color:rgba(255,154,46,.4)}
body.msn .mode{border-radius:2px;background:#fff;border-color:#aca899}
.compose{display:flex;gap:8px;align-items:center}
#say{flex:1;min-width:0;background:#0e0c0b;border:1px solid var(--line);color:var(--txt);
  padding:11px 12px;border-radius:10px}
body.msn #say{background:#fff;border:1px solid #7f9db9;color:#000;border-radius:2px;padding:7px 8px}
#say:disabled{color:var(--dim2)}
#say:focus{outline:2px solid var(--ember);outline-offset:-1px}
#send{background:var(--panel);border:1px solid var(--line);color:var(--ember2);border-radius:10px;
  padding:11px 14px;cursor:pointer;font-weight:600}
body.msn #send{background:linear-gradient(180deg,#fdfdfd,#eceade 45%,#dcd8c4);color:#000;
  border:1px solid #7f9db9;border-radius:3px;padding:7px 14px;font-weight:400}
#ac{position:absolute;left:10px;right:10px;bottom:100%;margin-bottom:6px;background:#1c1715;
  border:1px solid var(--line);border-radius:10px;padding:6px;display:none;gap:4px;flex-wrap:wrap;
  max-height:150px;overflow:auto;box-shadow:0 -10px 30px rgba(0,0,0,.5);z-index:12}
body.msn #ac{background:#fff;border:1px solid #7f9db9;border-radius:2px}
#ac.open{display:flex}
.ac-i{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:7px;cursor:pointer;font-size:12.5px}
.ac-i.sel{background:rgba(255,154,46,.16);color:var(--ember2)}
body.msn .ac-i.sel{background:#316ac5;color:#fff}
.ac-i img{height:24px}
#ac.col{flex-direction:column;flex-wrap:nowrap;max-height:190px}
#ac.col .ac-i{width:100%;font-size:14px;padding:7px 9px}
.ac-i .un{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.ac-i em{margin-left:auto} .ac-i em{font-style:normal;font-family:var(--mono);font-size:9px;color:var(--dim2)}

/* ── emote seçici ────────────────────────── */
#scrim{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:16;display:none}
#scrim.on{display:block}
#pick{position:absolute;left:0;right:0;bottom:0;z-index:19;display:flex;flex-direction:column;
  max-height:min(62vh,440px);background:#1a1614;border-top:1px solid var(--line);
  border-radius:14px 14px 0 0;padding-bottom:env(safe-area-inset-bottom);
  box-shadow:0 -14px 40px rgba(0,0,0,.6);
  visibility:hidden;pointer-events:none;
  transform:translateY(102%);
  transition:transform .26s cubic-bezier(.2,.85,.25,1),visibility .26s}
body.msn #pick{background:var(--bg);border:1px solid #0831d9;border-radius:8px 8px 0 0}
#pick.open{transform:none;visibility:visible;pointer-events:auto}
.ph{display:flex;gap:6px;align-items:center;padding:9px 10px;flex:0 0 auto}
body.msn .ph{background:linear-gradient(180deg,#0058ee,#3f8cf3 8%,#0054e3 42%,#0946d0);padding:4px 5px}
#psearch{flex:1;min-width:0;background:#0e0c0b;border:1px solid var(--line);color:var(--txt);
  padding:10px 11px;border-radius:var(--rad)}
body.msn #psearch{background:#fff;color:#000;border:1px solid #7f9db9;padding:4px 6px;border-radius:2px}
#pclose{flex:0 0 auto;width:44px;height:44px;border-radius:var(--rad);border:1px solid var(--line);
  background:var(--panel);color:var(--txt);font-size:22px;line-height:1;cursor:pointer}
body.msn #pclose{width:26px;height:22px;font-size:12px;font-weight:700;color:#fff;
  background:linear-gradient(180deg,#f08e6a,#d8481f);border:1px solid #fff;border-radius:3px}
.pf{display:flex;gap:6px;padding:0 10px 8px;overflow-x:auto;scrollbar-width:none;flex:0 0 auto}
body.msn .pf{padding:6px}
.pf::-webkit-scrollbar{display:none}
.pf button{background:var(--panel);border:1px solid var(--line);color:var(--dim);white-space:nowrap;
  border-radius:20px;padding:6px 13px;font-size:12px;cursor:pointer;font-family:var(--mono)}
.pf button[aria-pressed="true"]{color:var(--on);background:var(--ember);border-color:transparent}
body.msn .pf button{border-radius:3px;background:linear-gradient(180deg,#fdfdfd,#eceade 45%,#dcd8c4);color:#000}
body.msn .pf button[aria-pressed="true"]{background:#316ac5;color:#fff;border-color:#0a246a}
#pgrid{flex:1 1 auto;overflow-y:auto;padding:4px 8px 14px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:3px}
body.msn #pgrid{background:#fff;margin:0 5px 5px;border:1px solid #7f9db9}
.pe{display:flex;align-items:center;justify-content:center;height:46px;border-radius:var(--rad);
  cursor:pointer;background:transparent;border:0;font-size:24px}
.pe:hover{background:rgba(255,255,255,.07)}
body.msn .pe:hover{background:#e2ecf9}
.pe img{max-height:32px;max-width:100%}
.pe.lock{position:relative}
.pe.lock img{filter:grayscale(1) brightness(.75);opacity:.55}
.pe.lock::after{content:'🔒';position:absolute;right:2px;bottom:1px;font-size:11px;
  text-shadow:0 1px 2px #000}
.pmsg{grid-column:1/-1;color:var(--dim2);font-size:12px;text-align:center;padding:16px 0}

/* ── MSN pencere kromu ───────────────────── */
#chanBox{display:flex;gap:8px;flex:1 1 90px;min-width:0}
.torow{display:none}
body.msn .torow{display:flex;gap:5px;padding-top:3px}
body.msn .torow #chanBox{flex:1}
.winico{width:19px;height:17px;align-self:center;flex:0 0 auto;background-size:contain;background-repeat:no-repeat;
  background-position:center}
body.msn .top{padding:2px 3px 2px 5px}
body.msn .mark{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ikon şeridi: MSN'in 32px'lik düğmeleri */
body.msn #tools{padding:3px 4px;gap:0}
body.msn .tool{min-width:56px;padding:3px 7px 2px;gap:1px}
body.msn .tool .ic{font-size:24px;width:26px;height:26px;display:flex;align-items:center;
  justify-content:center;background-size:contain;background-repeat:no-repeat;background-position:center}
body.msn .tool .ic.img{font-size:0}
body.msn .tool .lb{font-size:10px;line-height:1.15}
.tbdeco{display:none}
body.msn .tbdeco{display:block;position:relative;flex:0 0 161px;width:161px;align-self:stretch}
body.msn .tbtab{position:absolute;inset:0}
body.msn .rnd{position:absolute;top:62%;width:12.4%;aspect-ratio:1;transform:translateY(-50%);
  border:0;background:no-repeat center/contain;cursor:pointer;padding:0;border-radius:50%}
body.msn .rnd:active{transform:translateY(-50%) scale(.9)}
body.msn #rBlock{left:20.5%} body.msn #rPen{left:34.2%}
body.msn .msnlogo{position:absolute;right:22.5%;top:6%;width:23.3%;height:28%;
  background-size:contain;background-repeat:no-repeat;background-position:right center}
/* krom renk filtresi — yalnızca arka plan katmanına */
body.msn .top{position:relative}
body.msn #toolsWrap,body.msn .tbdeco{position:relative;background-image:none}
body.msn #toolsWrap::before,body.msn .tbdeco::before{
  content:'';position:absolute;inset:0;z-index:0;pointer-events:none;
  filter:hue-rotate(var(--chue,0deg)) saturate(var(--csat,1))}
body.msn .top{background:linear-gradient(180deg,#0058ee 0%,#3f8cf3 8%,#0054e3 42%,#0054e3 88%,#0946d0 100%)}
body.msn #toolsWrap::before{background:var(--tbtile) repeat-x left center/auto 100%}
body.msn .tbdeco::before{background:var(--curve) no-repeat right center/auto 100%}
body.msn #tools{position:relative;z-index:1}
body.msn .tbdeco>*{z-index:1}
body.msn .tbdeco{flex:0 0 161px}
/* XP kaydırma çubuğu */
body.msn #chat::-webkit-scrollbar{width:16px;background:#f1f0e9}
body.msn #chat::-webkit-scrollbar-track{background:#f1f0e9;border-left:1px solid #d6d2c2}
body.msn #chat::-webkit-scrollbar-thumb{background:linear-gradient(90deg,#fdfefe,#cfe0f7 40%,#a8c8ec);
  border:1px solid #6f8dbb;border-radius:2px}
body.msn #chat::-webkit-scrollbar-button:vertical{height:16px;
  background:linear-gradient(180deg,#fdfefe,#dfe8f5);border:1px solid #6f8dbb;border-radius:2px}
/* kendi resmin: yazma alanının sağında (orijinaldeki gibi) */
.mepic{display:none;width:44px;height:44px;flex:0 0 auto;border:1px solid #7f9db9;background:#fff;
  align-items:center;justify-content:center;font-size:20px;overflow:hidden}
.mepic img{width:100%;height:100%;object-fit:cover}
body.msn .mepic{display:flex}
body.msn #dp .box.me{display:none}
.msnonly{display:none}
body.msn .msnonly{display:flex}
body.msn #emobtn{display:none}
body:not(.msn) #tEmo{display:none}
.menubar{gap:2px;padding:2px 4px;background:linear-gradient(180deg,#fdfdfd,#eceada 60%,#e3e0cf);
  border-bottom:1px solid #aca899;flex:0 0 auto}
.menubar button{background:none;border:0;font-family:var(--sans);font-size:12px;color:#000;padding:2px 8px;cursor:pointer;border-radius:2px}
.menubar button:hover{background:#316ac5;color:#fff}
.tobar{flex-direction:column;gap:3px;padding:5px 6px;background:var(--bg);border-bottom:1px solid #7f9db9;flex:0 0 auto}
body.msn .tobar .to{background:#fff;border:1px solid #7f9db9;border-radius:2px;padding:3px 6px}
.tobar .to{display:flex;align-items:center;gap:6px;font-family:var(--sans);font-size:12px;color:#333}
.tobar .to b{color:#000;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mesub{display:inline-flex;align-items:center;gap:4px;flex:0 0 auto;
  font-size:10.5px;color:var(--dim);white-space:nowrap}
.mesub-t{font-family:var(--mono)}
body.msn .mesub{color:#2a6b2a}
.live{display:inline-flex;align-items:center;gap:4px;flex:0 0 auto;margin-left:auto;
  font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.02em;
  padding:2px 8px;border-radius:20px;background:#e0113a;color:#fff}
.live::before{content:'';width:6px;height:6px;border-radius:50%;background:#fff;
  animation:blip 2s ease-in-out infinite}
.live.off{background:transparent;border:1px solid var(--line);color:var(--dim2);font-weight:400}
.live.off::before{display:none}
@keyframes blip{50%{opacity:.35}}
body.msn .live{border-radius:3px;padding:1px 6px}
body:not(.msn) .tobar{background:var(--bg2);border-bottom:1px solid var(--line);padding:7px 10px;gap:4px}
body:not(.msn) .tolab{display:none}
body:not(.msn) .tobar .to{font-size:13.5px;color:var(--txt);gap:8px}
body:not(.msn) .tobar .to b{color:var(--txt)}
body:not(.msn) .tobar .to img{border-radius:50%;border:1px solid var(--line);width:22px;height:22px}
body:not(.msn) .tobar .nfo{background:transparent;border:0;padding:0 0 0 30px;color:var(--dim);
  font-size:11.5px;font-family:var(--mono)}
body:not(.msn) .tobar .nfo i{display:none}
.tobar .to img{width:20px;height:20px;border:1px solid #7f9db9;border-radius:2px;object-fit:cover}
.tobar .nfo{display:flex;gap:6px;align-items:flex-start;background:#fffde7;border:1px solid #d9c98a;
  padding:4px 7px;font-family:var(--sans);font-size:11.5px;color:#4a4531;border-radius:2px}
.tobar .nfo i{font-style:normal;color:#316ac5;font-weight:700}
#mid{display:flex;flex:1 1 auto;min-height:0}
#chatwrap{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
#dp{display:none;flex:0 0 auto;width:96px;padding:5px 5px 5px 0;flex-direction:column;gap:5px}
#dp .box{background:#fff;border:1px solid #7f9db9;border-radius:2px;aspect-ratio:1;overflow:hidden;
  display:flex;align-items:center;justify-content:center}
#dp .box img{width:100%;height:100%;object-fit:cover}
#dp .box.me{background:linear-gradient(180deg,#e9f0fb,#c9dcf5);font-size:26px;line-height:1;color:#5a7ba8}
body.msn #dp{display:none}
@media(min-width:560px){body.msn #dp{display:flex}}
.fmtbar{gap:3px;padding:4px 6px;background:var(--bg);border-top:1px solid #d6d2c2;flex:0 0 auto;align-items:center;flex-wrap:wrap}
.fmtbar button{background:none;border:1px solid transparent;border-radius:3px;font-family:var(--sans);font-size:11.5px;color:#00309c;
  padding:3px 8px;cursor:pointer;display:flex;align-items:center;gap:4px}
.fmtbar button:hover{background:#e2ecf9;border-color:#b6d0ee}
.fmtbar .sep{width:1px;height:16px;background:#c9c5b4;margin:0 3px}
.fi{width:20px;height:18px;display:inline-block;background-size:contain;
  background-repeat:no-repeat;background-position:center;flex:0 0 auto}
body.msn .fmtbar{background:linear-gradient(180deg,#f7fbff,#e6f0fb 60%,#dbe8f8);border-top:1px solid #7f9db9}
.statusbar{gap:6px;padding:3px 8px;background:var(--bg);border-top:1px solid #d6d2c2;
  font-family:var(--sans);font-size:11px;color:#4a4a4a;flex:0 0 auto;justify-content:space-between;align-items:center}
.statusbar .tab{border:1px solid #aca899;border-bottom:0;background:linear-gradient(180deg,#fff,#e6e3d5);
  padding:2px 10px;border-radius:3px 3px 0 0}
.mehdr{display:flex;padding:10px;gap:10px;align-items:center;
  background:linear-gradient(180deg,rgba(255,154,46,.10),transparent);border-bottom:1px solid var(--line)}
.mehdr .av{width:38px;height:38px;border:1px solid var(--line);background:var(--panel);border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:19px;overflow:hidden;flex:0 0 auto}
.mehdr .av img{width:100%;height:100%;object-fit:cover}
.mehdr .who{font-family:var(--disp);font-weight:700;font-size:14px;color:var(--txt);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mehdr .st{font-family:var(--mono);font-size:10.5px;color:var(--dim2);margin-top:1px}
body.msn .mehdr{padding:7px 8px;gap:7px;
  background:linear-gradient(180deg,#f4f8ff,#dfeafb);border-bottom:1px solid #a9c4e4}
body.msn .mehdr .av{width:34px;height:34px;border:1px solid #7f9db9;background:#fff;border-radius:2px}
body.msn .mehdr .who{font-family:var(--disp);font-size:12px;font-weight:700;color:#00309c}
body.msn .mehdr .st{font-family:var(--mono);font-size:11px;color:#5a5a5a;margin:0}
@keyframes nudge{0%,100%{transform:none}12%{transform:translate(-7px,4px)}28%{transform:translate(6px,-5px)}
  45%{transform:translate(-5px,-3px)}62%{transform:translate(4px,5px)}80%{transform:translate(-3px,2px)}}
.nudging{animation:nudge .55s ease-in-out 2}

.men{display:inline-block;padding:1px 6px;border-radius:5px;font-weight:600;cursor:pointer;
  background:rgba(255,154,46,.14);color:var(--ember2);border:1px solid rgba(255,154,46,.28)}
.men:hover{background:rgba(255,154,46,.26)}
.men.self{background:var(--ember);color:var(--on);border-color:transparent}
body.msn .men{background:#e3edfb;color:#00309c;border:1px solid #a9c4e4;border-radius:3px;padding:0 4px}
body.msn .men:hover{background:#cfe0f7}
body.msn .men.self{background:#316ac5;color:#fff;border-color:#0a246a}
.u{cursor:pointer}
.u:hover{text-decoration:underline}

/* ── kullanıcı kartı ─────────────────────── */
#ucard{position:absolute;left:50%;top:50%;transform:translate(-50%,-46%) scale(.94);z-index:43;
  width:min(330px,90vw);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
#ucard.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.uc-top{display:flex;gap:12px;align-items:center;padding:14px 14px 10px}
.uc-av{width:64px;height:64px;border-radius:50%;overflow:hidden;flex:0 0 auto;
  background:var(--panel);border:2px solid var(--ember);display:flex;align-items:center;justify-content:center;font-size:26px}
body.msn .uc-av{border-radius:3px;border:1px solid #7f9db9}
.uc-av img{width:100%;height:100%;object-fit:cover}
.uc-nm{font-family:var(--disp);font-weight:700;font-size:18px;line-height:1.2;word-break:break-word}
body.msn .uc-nm{font-family:var(--disp);font-size:15px;font-weight:700;color:#00309c}
.uc-lo{font-family:var(--mono);font-size:11px;color:var(--dim2)}
.uc-chips{display:flex;gap:5px;flex-wrap:wrap;padding:0 14px 10px}
.uc-rows{padding:0 14px 12px;display:flex;flex-direction:column;gap:7px}
.uc-r{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;
  border-bottom:1px dashed var(--line);padding-bottom:6px}
.uc-r span:first-child{color:var(--dim)}
.uc-r span:last-child{text-align:right;font-weight:600}
.uc-bio{padding:0 14px 12px;font-size:12px;color:var(--dim);font-style:italic;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

.lrow{display:flex;align-items:center;gap:7px}
.qm{width:18px;height:18px;border-radius:50%;border:1px solid var(--line);background:var(--panel);
  color:var(--dim);font:700 11px/1 var(--sans);cursor:pointer;padding:0;vertical-align:1px}
body.msn .qm{background:linear-gradient(180deg,#fdfdfd,#dcd8c4);border-color:#7f9db9;color:#00309c}
#tip{position:absolute;z-index:50;max-width:min(300px,86vw);display:none;
  background:#ffffe1;border:1px solid #a0a08c;color:#000;font:12px/1.5 var(--sans);
  padding:8px 10px;border-radius:3px;box-shadow:2px 3px 8px rgba(0,0,0,.35)}
#tip.on{display:block}
#tip a{color:#00309c}
#helpWin{position:absolute;left:50%;top:50%;transform:translate(-50%,-46%) scale(.95);z-index:44;
  width:min(340px,92vw);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
#helpWin.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.help-b{max-height:60vh;overflow:auto;padding:10px 12px 14px;font-size:12.5px;line-height:1.55}
.help-i{background:#ffffe1;border:1px solid #d9c98a;color:#000;border-radius:3px;padding:8px 10px;margin-bottom:8px}
.help-i a{color:#00309c}

/* ── emote bilgi kartı ───────────────────── */
#ecard{position:absolute;left:50%;top:50%;transform:translate(-50%,-46%) scale(.94);z-index:42;
  width:min(300px,86vw);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
#ecard.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.ec-in{background:#1c1715;border:1px solid var(--line);border-radius:12px;overflow:hidden;
  box-shadow:0 18px 50px rgba(0,0,0,.6)}
body.msn .ec-in{background:var(--bg);border:1px solid #0831d9;border-radius:8px}
.ec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;
  font-family:var(--mono);font-size:13px;font-weight:600;color:var(--txt);border-bottom:1px solid var(--line)}
body.msn .ec-h{background:linear-gradient(180deg,#0058ee,#3f8cf3 8%,#0054e3 42%,#0946d0);color:#fff;
  font-family:var(--disp);font-size:12px;font-weight:700;border:0;padding:4px 6px}
.ec-h span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ec-h button{flex:0 0 auto;background:none;border:0;color:var(--dim);font-size:17px;cursor:pointer;padding:2px 6px;line-height:1}
body.msn .ec-h button{color:#fff;background:linear-gradient(180deg,#f08e6a,#d8481f);
  border:1px solid #fff;border-radius:3px;font-size:11px;font-weight:700;padding:1px 7px}
.ec-b{padding:14px 12px 10px;text-align:center}
.ec-img{display:flex;align-items:center;justify-content:center;min-height:112px;
  background:repeating-conic-gradient(#00000012 0 25%,transparent 0 50%) 0 0/16px 16px,#241d1a;
  border:1px solid var(--line);border-radius:8px;padding:8px}
body.msn .ec-img{background:repeating-conic-gradient(#0000000d 0 25%,transparent 0 50%) 0 0/16px 16px,#fff;
  border:1px solid #7f9db9;border-radius:2px}
.ec-img img{max-height:112px;max-width:100%;object-fit:contain}
.ec-meta{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;
  font-size:11.5px;color:var(--dim);flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.06em;padding:2px 7px;
  border-radius:20px;background:var(--ember);color:var(--on)}
.ec-f{display:flex;gap:8px;padding:0 12px 12px}
.ec-f .mini{flex:1;text-align:center;font-size:12.5px;padding:9px 6px}
@keyframes pop{50%{transform:scale(1.45)}}
.emote.tapped{animation:pop .32s ease}

#toast{position:absolute;left:50%;transform:translateX(-50%);bottom:110px;z-index:41;
  background:#2a221d;border:1px solid var(--line);color:#efe6dd;font-size:12.5px;padding:8px 14px;
  border-radius:20px;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.show{opacity:1}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(min-width:900px){ #side{width:270px} }
</style>

const BTTV_ZW=new Set(['SoSnowy','IceCold','SantaHat','TopHat','ReinDeer','CandyCane','cvMask','cvHazmat']);
const j=u=>fetch(u).then(r=>r.ok?r.json():Promise.reject(r.status));
const add=(c,url,big,zw,src)=>{if(!EMO.has(c))EMO.set(c,{url,big,zw,src});};
const bttv=(id,s)=>`https://cdn.betterttv.net/emote/${id}/${s}x.webp`;
function sev(e){const h=e.data&&e.data.host;if(!h)return;
  const base='https:'+h.url,f=(h.files||[]).map(x=>x.name);
  const pick=n=>base+'/'+(f.includes(n+'x.webp')?n+'x.webp':n+'x.avif');
  add(e.name,pick(1),pick(4),!!((e.flags&256)||(e.data.flags&256)),'7TV');}
function ffz(e){const u=e.animated||e.urls;add(e.name,u[1]||u['1'],u[4]||u['4']||u[2]||u['2']||u[1]||u['1'],false,'FFZ');}
async function twitchId(n){
  if(await ensureHelix()){
    try{const d=await helix('users?login='+encodeURIComponent(n));
      if(d.data&&d.data[0])return d.data[0].id;}catch(e){}
  }
  try{const a=await j('https://api.ivr.fi/v2/twitch/user?login='+n);if(a&&a[0]&&a[0].id)return a[0].id;}catch(e){}
  try{const r=await fetch('https://decapi.me/twitch/id/'+n);const t=(await r.text()).trim();if(/^\d+$/.test(t))return t;}catch(e){}
  try{const f=await j('https://api.frankerfacez.com/v1/room/'+n);if(f.room&&f.room.twitch_id)return String(f.room.twitch_id);}catch(e){}
  return null;
}
async function loadEmotes(name){
  EMO.clear();
  const id=await twitchId(name), T=[];
  loadBadges(id);loadSubEmotes(name,id);
  T.push(j('https://api.betterttv.net/3/cached/emotes/global').then(l=>{
    l.forEach(e=>add(e.code,bttv(e.id,1),bttv(e.id,3),BTTV_ZW.has(e.code),'BTTV'));return 'BTTV global '+l.length;}));
  if(id)T.push(j('https://api.betterttv.net/3/cached/users/twitch/'+id).then(d=>{
    const l=[...(d.channelEmotes||[]),...(d.sharedEmotes||[])];
    l.forEach(e=>add(e.code,bttv(e.id,1),bttv(e.id,3),BTTV_ZW.has(e.code),'BTTV'));return 'BTTV kanal '+l.length;}));
  T.push(j('https://7tv.io/v3/emote-sets/global').then(d=>{(d.emotes||[]).forEach(sev);return '7TV global '+(d.emotes||[]).length;}));
  if(id)T.push(j('https://7tv.io/v3/users/twitch/'+id).then(d=>{
    const l=(d.emote_set&&d.emote_set.emotes)||[];l.forEach(sev);return '7TV kanal '+l.length;}));
  T.push(j('https://api.frankerfacez.com/v1/set/global').then(d=>{let n=0;
    Object.values(d.sets||{}).forEach(s=>(s.emoticons||[]).forEach(e=>{ffz(e);n++;}));return 'FFZ global '+n;}));
  T.push(j('https://api.frankerfacez.com/v1/room/'+name).then(d=>{let n=0;
    Object.values(d.sets||{}).forEach(s=>(s.emoticons||[]).forEach(e=>{ffz(e);n++;}));return 'FFZ kanal '+n;}));
  const r=await Promise.allSettled(T);
  info(T('loadedEmotes',EMO.size,r.filter(x=>x.status==='fulfilled').map(x=>x.value).join(' · ')));
}

/* ── Twitch resmî API (token varsa) ─────── */
let clientId='', tokRaw='';
function helixReady(){return !!(clientId&&tokRaw);}
async function helix(path){
  const r=await fetch('https://api.twitch.tv/helix/'+path,
    {headers:{'Client-Id':clientId,'Authorization':'Bearer '+tokRaw}});
  if(!r.ok)throw r.status;
  return r.json();
}
// token'ı doğrulayıp client_id'yi öğren (Helix bunu şart koşuyor)
async function ensureHelix(){
  const raw=$('tok').value.trim().replace(/^oauth:/,'');
  if(!raw){clientId='';tokRaw='';return false;}
  if(helixReady()&&tokRaw===raw)return true;
  try{
    const d=await(await fetch('https://id.twitch.tv/oauth2/validate',
      {headers:{Authorization:'OAuth '+raw}})).json();
    if(d&&d.client_id){clientId=d.client_id;tokRaw=raw;return true;}
  }catch(e){}
  return false;
}

/* ── rozetler (gerçek görseller) ─────────── */
const BADGES={};
async function firstOk(urls){
  for(const u of urls){ try{ const d=await j(u); if(d) return {u,d}; }catch(e){} }
  return null;
}
function putBadges(d){
  let n=0;
  const add=(set,ver,url,title)=>{ if(!url)return; BADGES[set+'/'+ver]={url,title:title||set}; n++; };
  if(d&&d.badge_sets){                       // badges.twitch.tv biçimi
    Object.entries(d.badge_sets).forEach(([set,v])=>
      Object.entries(v.versions||{}).forEach(([ver,b])=>
        add(set,ver,b.image_url_2x||b.image_url_1x,b.title)));
  }else{                                     // dizi biçimi (IVR vb.)
    const arr=Array.isArray(d)?d:(d&&(d.badges||d.data))||[];
    arr.forEach(s=>{
      const set=s.set_id||s.setID||s.id;
      (s.versions||[]).forEach(v=>
        add(set,v.id||v.version,v.image_url_2x||v.imageUrl2x||v.image_url_4x||v.image_url_1x,v.title));
    });
  }
  return n;
}
async function loadBadges(id){
  let ng=0,nc=0,src='';
  // 1) resmî uç (token varsa) — HTTPS'te CORS sorunu yok
  if(await ensureHelix()){
    try{ng=putBadges(await helix('chat/badges/global'));src='helix';}catch(e){}
    if(id){try{nc=putBadges(await helix('chat/badges?broadcaster_id='+id));src='helix';}catch(e){}}
  }
  // 2) eski açık uç (tokensizken)
  if(!ng){try{ng=putBadges(await j('https://badges.twitch.tv/v1/badges/global/display'));src='legacy';}catch(e){}}
  if(!nc&&id){try{nc=putBadges(await j('https://badges.twitch.tv/v1/badges/channels/'+id+'/display'));src=src||'legacy';}catch(e){}}
  info(ng+nc ? T('badgeInfo',ng,nc)+' ('+src+')' : T('badgeFail'));
  repaintBadges();meBadge();
}
// zaten çizilmiş mesajların çiplerini gerçek rozetle değiştir
function repaintBadges(){
  document.querySelectorAll('.msg[data-bd]').forEach(n=>{
    const t={badges:n.dataset.bd,'badge-info':n.dataset.bi||''};
    const holder=n.querySelector('.bhold'); if(holder)holder.innerHTML=badges(t);
  });
}

function collectEmotes(d){
  // olası biçimlerin hepsini düzleştir
  let out=[];
  const push=a=>{ if(Array.isArray(a)) out=out.concat(a); };
  if(Array.isArray(d)) push(d);
  else if(d&&typeof d==='object'){
    push(d.emotes); push(d.channelEmotes); push(d.data); push(d.subscriberEmotes);
    if(d.sets&&typeof d.sets==='object')
      Object.values(d.sets).forEach(s=>push(s.emotes||s));
    if(Array.isArray(d.emoteSets)) d.emoteSets.forEach(s=>push(s.emotes));
  }
  return out;
}

function parse(line){
  let tags={},rest=line;
  if(line[0]==='@'){const s=line.indexOf(' ');
    line.slice(1,s).split(';').forEach(p=>{const i=p.indexOf('=');
      tags[p.slice(0,i)]=p.slice(i+1).replace(/\\s/g,' ').replace(/\\:/g,';').replace(/\\\\/g,'\\');});
    rest=line.slice(s+1);}
  let pre='';
  if(rest[0]===':'){const s=rest.indexOf(' ');pre=rest.slice(1,s);rest=rest.slice(s+1);}
  const s=rest.indexOf(' ');
  return{tags,nick:pre.split('!')[0],cmd:s<0?rest:rest.slice(0,s),args:s<0?'':rest.slice(s+1)};
}
const trail=a=>{const i=a.indexOf(':');return i<0?'':a.slice(i+1);};

function connect(name){
  if(live) disconnect(true);
  ch=(name||$('chan').value).trim().toLowerCase().replace(/^.*twitch\.tv\//,'').replace(/[^a-z0-9_]/g,'');
  if(!ch){info(T('needChan'),1);return;}
  $('chan').value=ch;
  chat.innerHTML='';EMO.clear();recent.length=0;
  info(T('loadingEmotes',ch));
  myTier=0;myMonths=0;myBadgeTag='';SUB.clear();
  loadEmotes(ch);loadAvatar(ch);
  const tok=$('tok').value.trim(), nk=$('nick').value.trim().toLowerCase();
  me=(tok&&nk)?nk:'';
  ws=new WebSocket('wss://irc-ws.chat.twitch.tv:443');
  ws.onopen=()=>{
    ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
    ws.send('PASS '+(me?(tok.startsWith('oauth:')?tok:'oauth:'+tok):'SCHMOOPIIE'));
    ws.send('NICK '+(me||'justinfan'+(10000+Math.floor(Math.random()*89999))));
    ws.send('JOIN #'+ch);
    live=true;$('go').textContent=T('leave');$('go').classList.add('on');
    $('say').disabled=!me;$('send').disabled=!me;
    $('say').placeholder=me?T('sayTo',ch):T('anonHint');
    document.title=(skin==='msn'?'MSN':'Ember')+' · #'+ch;titleBar();
    info(me?T('connectedAs',ch,me):T('anonMode',ch));
    drawChans();
  };
  ws.onmessage=e=>e.data.split('\r\n').forEach(l=>l&&route(l));
  ws.onerror=()=>info(T('connErr'),1);
  ws.onclose=()=>{if(live)info(T('connClosed'),1);disconnect(1);};
}
function disconnect(q){
  live=false;
  if(ws){ws.onclose=null;try{ws.close()}catch(e){}}
  ws=null;$('go').textContent=T('connect');$('go').classList.remove('on');
  $('say').disabled=true;$('send').disabled=true;
  if(!q)info(T('leftChan'));
  clearTimeout(infoTimer);$('toLive').className='live off';$('toLive').textContent=T('offChip');
  $('toInfo').textContent=T('connOff');titleBar();
  drawChans();statusLine();
}
function route(line){
  if(line.startsWith('PING')){ws.send('PONG :tmi.twitch.tv');return;}
  const m=parse(line);
  switch(m.cmd){
    case 'PRIVMSG':render(m);break;
    case 'USERNOTICE':notice(m);break;
    case 'ROOMSTATE':modes(m.tags);break;
    case 'USERSTATE':{
      if(m.tags.color)myColor=m.tags.color;
      const b=m.tags.badges||'',i=m.tags['badge-info']||'';
      const sv=b.match(/(?:subscriber|founder)\/(\d+)/);
      myTier=sv?(+sv[1]>=3000?3:+sv[1]>=2000?2:1):0;
      const mo=i.match(/(?:subscriber|founder)\/(\d+)/);
      myMonths=mo?+mo[1]:0;
      myBadgeTag=b;
      syncSubEmotes();meBadge();subTabLabel();
      if($('pick').classList.contains('open')&&pfilter==='sub')drawPick();
      break;}
    case 'CLEARCHAT':{const t=trail(m.args);
      if(t)document.querySelectorAll('.msg[data-u="'+CSS.escape(t)+'"]').forEach(n=>n.classList.add('gone'));
      else{chat.innerHTML='';info(T('cleared'));}break;}
    case 'CLEARMSG':{const n=document.querySelector('.msg[data-id="'+CSS.escape(m.tags['target-msg-id']||'')+'"]');
      if(n)n.classList.add('gone');break;}
    case 'NOTICE':info(trail(m.args),/auth|fail|banned/i.test(m.args));break;
  }
}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CHIP={broadcaster:['YAYINCI','b-brd'],moderator:['MOD','b-mod'],vip:['VIP','b-vip'],
  founder:['KURUCU','b-fnd'],subscriber:['ABONE','b-sub']};
function badges(t){
  const raw=(t.badges||'').split(',').filter(Boolean);
  const info=t['badge-info']||'';
  let out='';
  for(const item of raw){
    const [set,ver]=item.split('/');
    const b=BADGES[set+'/'+ver]||BADGES[set+'/1'];
    let title=b?b.title:(CHIP[set]?CHIP[set][0]:set);
    if(set==='subscriber'){
      const mo=info.match(/subscriber\/(\d+)/);
      if(mo)title+=' · '+mo[1]+' ay';
    }
    if(b) out+=`<img class="bdg" src="${b.url}" alt="${esc(title)}" title="${esc(title)}">`;
    else if(CHIP[set]) out+=`<span class="badge ${CHIP[set][1]}">${CHIP[set][0]}</span>`;
  }
  return out;
}
function hue(n){let x=0;for(const c of n)x=(x*31+c.charCodeAt(0))|0;return `hsl(${Math.abs(x)%360} 68% 60%)`;}
function toHSL(c){
  c=String(c||'').trim();
  let m=/^hsl\(\s*([\d.]+)[\s,]+([\d.]+)%[\s,]+([\d.]+)%/.exec(c);
  if(m)return{h:+m[1],s:+m[2],l:+m[3]};
  m=/^#?([0-9a-f]{6})$/i.exec(c)||/^#?([0-9a-f]{3})$/i.exec(c);
  if(!m)return null;
  let x=m[1];if(x.length===3)x=x[0]+x[0]+x[1]+x[1]+x[2]+x[2];
  const r=parseInt(x.slice(0,2),16)/255,g=parseInt(x.slice(2,4),16)/255,b=parseInt(x.slice(4,6),16)/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;
  let hh=0;
  if(d){ hh = mx===r ? ((g-b)/d+(g<b?6:0)) : mx===g ? ((b-r)/d+2) : ((r-g)/d+4); hh*=60; }
  const l=(mx+mn)/2, s=d?d/(1-Math.abs(2*l-1)):0;
  return{h:hh,s:s*100,l:l*100};
}
// koyu temada çok koyu, açık temada çok açık renkleri okunur aralığa çeker
function readable(c){
  const p=toHSL(c);if(!p)return c;
  const msn=document.body.classList.contains('msn');
  let {h,s,l}=p;
  if(msn){ l=Math.min(l, s<15?35:42); }
  else   { l=Math.max(l, s<15?68:56); if(s>0&&s<25)s=Math.max(s,25); }
  return `hsl(${h.toFixed(0)} ${s.toFixed(0)}% ${l.toFixed(0)}%)`;
}
function repaintNames(){
  document.querySelectorAll('[data-raw]').forEach(n=>{n.style.color=readable(n.dataset.raw);});
}
function nativeSpans(tag){const out=[];if(!tag)return out;
  tag.split('/').forEach(p=>{const[id,pos]=p.split(':');if(!pos)return;
    pos.split(',').forEach(r=>{const[a,b]=r.split('-').map(Number);out.push({a,b,id});});});
  return out.sort((x,y)=>x.a-y.a);}
function build(text,tag){
  const cp=Array.from(text),spans=nativeSpans(tag);let out=[],i=0;
  for(const s of spans){
    if(s.a>i)out.push({txt:cp.slice(i,s.a).join('')});
    out.push({e:{url:`https://static-cdn.jtvnw.net/emoticons/v2/${s.id}/default/dark/1.0`,
      big:`https://static-cdn.jtvnw.net/emoticons/v2/${s.id}/default/dark/3.0`,src:'Twitch'},
      code:cp.slice(s.a,s.b+1).join('')});
    i=s.b+1;}
  if(i<cp.length)out.push({txt:cp.slice(i).join('')});
  const toks=[];
  for(const p of out){
    if(p.e){toks.push(p);continue;}
    p.txt.split(/(\s+)/).forEach(w=>{if(!w)return;
      const e=EMO.get(w);if(e){toks.push({e,code:w,zw:e.zw});return;}
      const mm=/^@([a-zA-Z0-9_]{2,25})([.,!?:;]*)$/.exec(w);
      if(mm){toks.push({men:mm[1],tail:mm[2]});return;}
      toks.push({txt:w});});}
  const fin=[];
  for(const t of toks){const last=fin[fin.length-1];
    if(t.zw&&last&&last.e){(last.over=last.over||[]).push({e:t.e,code:t.code});continue;}
    fin.push(t);}
  let html='',ec=0,tc=0;
  for(const t of fin){
    if(t.e){ec++;recent.push({code:t.code,url:t.e.url,t:Date.now()});
      const tag=(e,c)=>`<img class="emote" loading="lazy" src="${e.url}" alt="${esc(c||'')}" title="${esc(c||'')} · ${e.src||'?'}"`
        +` data-c="${esc(c||'')}" data-b="${esc(e.big||e.url)}" data-s="${esc(e.src||'Twitch')}">`;
      const img=tag(t.e,t.code);
      html+=t.over?`<span class="zw">${img}${t.over.map(o=>tag(o.e,o.code).replace('class="emote"','class="emote over"')).join('')}</span>`:img;
    }else if(t.men){
      tc++;
      const lo=t.men.toLowerCase(), self=me&&lo===me.toLowerCase();
      const known=USERS.get(lo);
      html+=`<span class="men${self?' self':''}" data-l="${esc(lo)}">@${esc(known?known.d:t.men)}</span>`+esc(t.tail||'');
    }else{const s=t.txt;if(s.trim())tc++;
      html+=esc(s).replace(/(https?:\/\/[^\s]+)/g,m=>`<a class="link" href="${m}" target="_blank" rel="noopener nofollow">${m}</a>`);}
  }
  return{html,jumbo:ec>0&&ec<=3&&tc===0};
}
function render(m){
  const t=m.tags;let text=trail(m.args),action=false;
  if(text.startsWith('\u0001ACTION')){action=true;text=text.slice(8,-1);}
  const nick=t['display-name']||m.nick;
  const raw=t.color||hue(nick.toLowerCase());
  const color=readable(raw);
  const{html,jumbo}=build(text,t.emotes);
  const prevU=USERS.get(m.nick);
  USERS.set(m.nick,{d:nick,c:raw,t:Date.now(),b:t.badges||'',n:(prevU?prevU.n:0)+1});
  if(USERS.size>900){[...USERS.entries()].sort((a,b)=>a[1].t-b[1].t).slice(0,250).forEach(([k])=>USERS.delete(k));}
  const mention=me&&new RegExp('(^|\\W)@?'+me+'(\\W|$)','i').test(text);
  const d=document.createElement('div');
  d.className='msg'+(action?' action':'')+(jumbo?' jumbo':'')+(t['first-msg']==='1'?' first':'')+(mention?' mention':'');
  d.dataset.u=m.nick;if(t.id)d.dataset.id=t.id;
  d.dataset.bd=t.badges||'';d.dataset.bi=t['badge-info']||'';
  d.innerHTML=`<span class="t">${new Date().toTimeString().slice(0,5)}</span>`
    +`<span class="bhold">${badges(t)}</span>`
    +`<span class="u" data-l="${esc(m.nick)}" data-raw="${esc(raw)}" data-says="${lang==='en'?'says':'diyor ki'}" style="color:${esc(color)}">${esc(nick)}</span> `
    +`<span class="body"${action?' data-raw="'+esc(raw)+'" style="color:'+esc(color)+'"':''}>${html}</span>`;
  push(d);
  rate.push(Date.now());
  alertFor(nick,text,mention);
}

const snd=$('snd'),sndN=$('sndN');let lastAlert=0,actx=null,abuf=null,abufN=null,audioReady=false;
async function initAudio(){
  if(audioReady)return true;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!actx&&AC)actx=new AC();
    if(actx){
      if(actx.state==='suspended')await actx.resume();
      const dec=async el=>{
        const b=await fetch(el.src).then(r=>r.arrayBuffer());
        return await new Promise((res,rej)=>{const p=actx.decodeAudioData(b,res,rej);if(p&&p.then)p.then(res,rej);});
      };
      if(!abuf)abuf=await dec(snd);
      if(!abufN){try{abufN=await dec(sndN);}catch(e){}}
      if(actx.state==='running'){audioReady=true;return true;}
    }
  }catch(e){}
  try{snd.muted=true;await snd.play();snd.pause();snd.currentTime=0;snd.muted=false;snd.volume=.6;
    audioReady=true;return true;}catch(e){}
  return false;
}
['pointerdown','keydown','touchstart'].forEach(ev=>addEventListener(ev,()=>{initAudio();},{passive:true}));
function ding(kind){
  if(!soundOn)return;
  const useN = kind==='nudge' && nudgeSound;
  const buf = useN ? (abufN||abuf) : abuf;
  const el  = useN ? ((abufN||sndN.src)?sndN:snd) : snd;
  if(actx&&buf&&actx.state==='running'){
    const s=actx.createBufferSource(),g=actx.createGain();
    s.buffer=buf;g.gain.value=useN?.85:.7;s.connect(g);g.connect(actx.destination);s.start(0);return;
  }
  try{el.currentTime=0;const p=el.play();p&&p.catch(()=>{});}catch(e){}
}
$('sndTest')&&($('sndTest').onclick=async()=>{
  const ok=await initAudio();ding();

function alertFor(nick,text,mention){
  if(notifyMode==='off')return;
  const busy=rate.length/10>1.2;            // >72 msg/dk
  if(notifyMode==='mention'&&!mention)return;
  if(notifyMode==='all'&&!mention&&busy)return;   // yoğunsa sadece mention
  const now=Date.now();
  if(!mention&&now-lastAlert<3000)return;
  lastAlert=now;
  ding(mention?'nudge':'msg');
  if(mention&&nudgeShake)shakeWin();
  if(document.hidden&&window.Notification&&Notification.permission==='granted'){
    try{new Notification((mention?'@ ':'')+nick+' · #'+ch,{body:text.slice(0,120)});}catch(e){}}
}

function applyIcons(){
  document.querySelectorAll('.fi[data-ic]').forEach(n=>{
    const u=ICONS[n.dataset.ic];
    if(u){n.style.backgroundImage=`url(${u})`;n.classList.add('img');}
  });
  document.querySelectorAll('.tool .ic[data-ic]').forEach(n=>{
    const u=ICONS[n.dataset.ic];
    n.classList.toggle('img',!!u);
    n.style.backgroundImage=u?`url(${u})`:'';
  });

  if(ICONS.win)$('winIco').style.backgroundImage=`url(${ICONS.win})`;
  if(ICONS.msnlogo)$('msnLogo').style.backgroundImage=`url(${ICONS.msnlogo})`;
  if(ICONS.rblock)$('rBlock').style.backgroundImage=`url(${ICONS.rblock})`;
  if(ICONS.rpen)$('rPen').style.backgroundImage=`url(${ICONS.rpen})`;
  const rs=document.documentElement.style;
  if(ICONS.curve)rs.setProperty('--curve',`url(${ICONS.curve})`);
  if(ICONS.tbtile)rs.setProperty('--tbtile',`url(${ICONS.tbtile})`);
}
function titleBar(){
  const m=$('mark');
  if(skin!=='msn'){m.innerHTML='ember<i>·</i>chat';return;}
  m.textContent = live&&ch ? (($('toName').textContent||ch).split(' (')[0])+' - Sohbet' : 'msn·chat';
}
function setSkin(s,quiet){
  skin=s;document.body.classList.toggle('msn',s==='msn');
  const box=$('chanBox');
  if(s==='msn')$('toRow').appendChild(box); else $('mark').after(box);
  titleBar();applyIcons();
  document.querySelectorAll('[data-skin]').forEach(b=>b.classList.toggle('key',b.dataset.skin===s));
  store.set({skin:s});drawChans();repaintNames();
  if(!quiet)toast(s==='msn'?'Windows XP / MSN':'Ember');
}
document.querySelectorAll('[data-skin]').forEach(b=>b.onclick=()=>setSkin(b.dataset.skin));
$('tSkin').onclick=()=>setSkin(skin==='msn'?'ember':'msn');
function resetChrome(quiet){
  document.documentElement.style.removeProperty('--chue');
  document.documentElement.style.removeProperty('--csat');
  $('chromeCol').value='#0054e3';store.set({chrome:''});
  if(!quiet)toast(T('colorReset'));
}
function setChrome(hex,quiet){
  const p=toHSL(hex);if(!p)return;
  const delta=Math.round(((p.h-214)%360+540)%360-180);
  const sat=(p.s/58).toFixed(2);
  document.documentElement.style.setProperty('--chue',delta+'deg');
  document.documentElement.style.setProperty('--csat',Math.max(.15,Math.min(1.8,sat)));
  $('chromeCol').value=hex;store.set({chrome:hex});
  if(!quiet)toast(T('colorChanged'));

let acList=[],acSel=0,acWord='';
say.addEventListener('input',()=>{
  const w=say.value.split(/\s/).pop();acWord=w;
  acList=[];
  if(w[0]==='@'){                       // kullanıcı tamamlama
    const q=w.slice(1).toLowerCase();
    acList=[...USERS.entries()]
      .filter(([k,v])=>!q||k.startsWith(q)||v.d.toLowerCase().startsWith(q))
      .sort((a,b)=>b[1].t-a[1].t).slice(0,12)
      .map(([,v])=>({ins:'@'+v.d,lab:v.d,color:readable(v.c),sub:T('inChat')}));
    if(!acList.length&&q.length>=2)
      acList=[{ins:'@'+w.slice(1),lab:w.slice(1),color:'',sub:T('notYet')}];
  }else if(w.length>=2){                // emote tamamlama
    const q=w.toLowerCase();
    acList=[...EMO.entries()].filter(([k])=>k.toLowerCase().startsWith(q)).slice(0,18)
      .map(([k,v])=>({ins:k,lab:k,url:v.url,sub:v.src}));
  }
  if(!acList.length){ac.classList.remove('open');return;}
  acSel=0;drawAc();
});
function drawAc(){
  ac.innerHTML=acList.map((it,i)=>
    `<div class="ac-i ${i===acSel?'sel':''}" data-i="${i}">`
    +(it.url?`<img src="${it.url}" alt="">`:`<span class="un" style="background:${esc(it.color||'#888')}"></span>`)
    +` ${esc(it.lab)} <em>${esc(it.sub)}</em></div>`).join('');
  ac.classList.add('open');ac.classList.toggle('col',!acList[0].url);
  const s=ac.querySelector('.sel');if(s&&s.scrollIntoView)s.scrollIntoView({block:'nearest',inline:'nearest'});
}
ac.onclick=e=>{const i=e.target.closest('.ac-i');if(i){acSel=+i.dataset.i;complete();}};
function complete(){
  if(!acList.length)return;
  const ins=acList[acSel].ins,parts=say.value.split(/(\s)/);
  for(let i=parts.length-1;i>=0;i--){if(parts[i]===acWord){parts[i]=ins+' ';break;}}
  say.value=parts.join('');ac.classList.remove('open');acList=[];say.focus();
}
say.addEventListener('keydown',e=>{
  if(acList.length&&(e.key==='Tab'||(e.key==='Enter'&&ac.classList.contains('open')))){e.preventDefault();complete();return;}
  if(acList.length&&/^Arrow(Right|Left|Down|Up)$/.test(e.key)){e.preventDefault();
    const fwd=e.key==='ArrowRight'||e.key==='ArrowDown';
    acSel=(acSel+(fwd?1:acList.length-1))%acList.length;drawAc();return;}
  if(e.key==='Escape'){ac.classList.remove('open');acList=[];}
  if(e.key==='Enter')send();

  const top=[...c.entries()].sort((a,b)=>b[1].n-a[1].n).slice(0,8);
  $('wnone').style.display=top.length?'none':'flex';
  const max=top.length?top[0][1].n:1;
  $('wrow').innerHTML=top.map(([code,v])=>{
    const s=Math.round(18+28*Math.sqrt(v.n/max));
    return `<div class="wq"><img src="${v.url}" alt="${esc(code)}" title="${esc(code)}" style="height:${s}px"><b>${v.n}</b></div>`;}).join('');
  const mps=rate.length/10;
  $('weather').style.setProperty('--heat',Math.min(.5,mps/14).toFixed(2));
  $('hype').style.width=Math.min(100,mps*7)+'%';
},1500);

/* ── kullanıcı kartı ────────────────────── */
const UCACHE=new Map();let ucLogin='';
const TR=(d,o)=>new Date(d).toLocaleDateString('tr-TR',o||{day:'numeric',month:'long',year:'numeric'});
function ageOf(iso){
  const a=new Date(iso),n=new Date();
  let y=n.getFullYear()-a.getFullYear(),m=n.getMonth()-a.getMonth();
  if(n.getDate()<a.getDate())m--;
  if(m<0){y--;m+=12;}
  return (y?T('yr',y):'')+(m?T('mo',m):(y?'':T('fresh')));
}
const NUM=n=>Number(n||0).toLocaleString('tr-TR');
function chip(t,bg){return `<span class="chip" style="${bg?'background:'+bg+';color:#fff':''}">${esc(t)}</span>`;}
function roleChips(u,badges){
  let s='';
  if(u){
    if(u.roles&&u.roles.isPartner)s+=chip('PARTNER','#9146ff');
    else if(u.roles&&u.roles.isAffiliate)s+=chip('AFFILIATE','#5c16c5');
    if(u.roles&&u.roles.isStaff)s+=chip('TWITCH STAFF','#000');
    if(u.banned)s+=chip('SUSPENDED','#c0392b');
  }
  const b=badges||'';
  if(/broadcaster/.test(b))s+=chip('YAYINCI','#c0392b');
  if(/moderator/.test(b))s+=chip('MOD','#1f7a3f');
  if(/vip/.test(b))s+=chip('VIP','#a0399a');
  if(/founder/.test(b))s+=chip('KURUCU','#8a6112');
  else if(/subscriber/.test(b))s+=chip('ABONE','#4b3fa8');
  return s;
}
async function openUser(login){
  login=String(login||'').toLowerCase();if(!login)return;
  ucLogin=login;
  const loc=USERS.get(login);
  $('ecard').classList.remove('show');$('ucard').classList.add('show');$('scrim').classList.add('on');
  $('ucTitle').textContent='@'+login;
  $('ucName').textContent=loc?loc.d:login;
  $('ucLogin').textContent=login;
  $('ucAv').innerHTML='👤';$('ucBio').textContent='';
  $('ucLink').href='https://twitch.tv/'+login;
  $('ucChips').innerHTML=roleChips(null,loc&&loc.b);
  $('ucReply').disabled=say.disabled;
  const rows=[];
  if(loc)rows.push([T('sess'),T('msgs',loc.n)]);
  $('ucRows').innerHTML=rows.map(r=>`<div class="uc-r"><span>${r[0]}</span><span>${r[1]}</span></div>`).join('')
    +'<div class="uc-r"><span>'+T('twInfo')+'</span><span>'+T('loading')+'</span></div>';

  let u=UCACHE.get(login);
  if(u===undefined){
    try{const a=await j('https://api.ivr.fi/v2/twitch/user?login='+login);u=(a&&a[0])||null;}catch(e){u=null;}
    UCACHE.set(login,u);
  }
  if(ucLogin!==login)return;
  if(!u){$('ucRows').innerHTML=rows.map(r=>`<div class="uc-r"><span>${r[0]}</span><span>${r[1]}</span></div>`).join('')
    +'<div class="uc-r"><span>'+T('twInfo')+'</span><span>'+T('failed')+'</span></div>';return;}
  if(u.logo)$('ucAv').innerHTML=`<img src="${esc(u.logo)}" alt="">`;
  $('ucName').textContent=u.displayName||login;
  $('ucChips').innerHTML=roleChips(u,loc&&loc.b);
  if(u.bio)$('ucBio').textContent=u.bio;
  const R=[...rows];
  if(u.createdAt)R.push([T('acct'),TR(u.createdAt)+' · '+ageOf(u.createdAt)]);
  if(u.followers!=null)R.push([T('followers'),NUM(u.followers)]);
  if(u.chatColor)R.push([T('chatColor'),'<span style="color:'+esc(u.chatColor)+'">'+esc(u.chatColor)+'</span>']);
  $('ucRows').innerHTML=R.map(r=>`<div class="uc-r"><span>${r[0]}</span><span>${r[1]}</span></div>`).join('')
    +(live?'<div class="uc-r" id="ucSub"><span>'+esc(T('subFollow',ch))+'</span><span>'+T('checking')+'</span></div>':'');

  if(live){
    try{
      const s=await j('https://api.ivr.fi/v2/twitch/subage/'+login+'/'+ch);
      if(ucLogin!==login||!$('ucSub'))return;
      const bits=[];
      if(s.followedAt)bits.push(T('followFor',ageOf(s.followedAt)));
      if(s.cumulative&&s.cumulative.months)bits.push(T('subFor',s.cumulative.months)+(s.meta&&s.meta.tier?' · T'+s.meta.tier:''));
      if(s.statusHidden)bits.push(T('hidden'));
      $('ucSub').lastElementChild.textContent=bits.length?bits.join(' · '):T('noRec');
    }catch(e){ if($('ucSub'))$('ucSub').lastElementChild.textContent=T('notPublic'); }
  }
}
function closeUser(){
  $('ucard').classList.remove('show');ucLogin='';
  if(!$('pick').classList.contains('open')&&!$('ecard').classList.contains('show')&&!$('side').classList.contains('open'))
    $('scrim').classList.remove('on');
}
$('ucX').onclick=closeUser;
$('ucReply').onclick=()=>{
  if(say.disabled||!ucLogin)return;
  const nm=(USERS.get(ucLogin)||{}).d||ucLogin;
  say.value=say.value+(say.value&&!/\s$/.test(say.value)?' ':'')+'@'+nm+' ';
  closeUser();say.focus();
};

/* ── emote kartı ────────────────────────── */
let ecCode='';
chat.addEventListener('click',e=>{
  const who=e.target.closest('.men,.u');
  if(who&&who.dataset.l){openUser(who.dataset.l);return;}
  const img=e.target.closest('img.emote');if(!img)return;
  const code=img.dataset.c||'', src=img.dataset.s||'?';
  img.classList.remove('tapped');void img.offsetWidth;img.classList.add('tapped');
  ecCode=code;
  $('ecName').textContent=code||'—';
  $('ecImg').src=img.dataset.b||img.src;
  $('ecSrc').textContent=src;
  const own=EMO.get(code);
  $('ecNote').textContent = src==='Twitch' ? T('twEmote')
    : (own? (img.classList.contains('over')||own.zw ? T('zeroW') : T('chanLoaded')) : T('otherSet'));

function closeCard(){$('ecard').classList.remove('show');if(!$('pick').classList.contains('open'))$('scrim').classList.remove('on');}
$('ecX').onclick=closeCard;
$('ecAdd').onclick=()=>{
  if(say.disabled||!ecCode)return;
  say.value=say.value+(say.value&&!/\s$/.test(say.value)?' ':'')+ecCode+' ';
  closeCard();say.focus();
};
$('ecCopy').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(ecCode);toast(T('copied',ecCode));closeCard();};


let fsOff=0,vvBase=0,kbLearned=0,fsAdj=0,vkOk=false,vkDead=false;

/* ── klavye (IME) uyumu ─────────────────── */
(function ime(){
  const vv=window.visualViewport, rs=document.documentElement.style;
  let raf=0;
  // Brave/Chromium tam ekranda görünmeyen tarayıcı çubuğunu hâlâ düşüyor:
  // visualViewport sabit bir miktar eksik bildiriyor. Farkı bir kez ölçüp ekliyoruz.
  function measureFsOff(){}
  function typing(){
    const a=document.activeElement;
    return !!(a&&/^(INPUT|TEXTAREA)$/.test(a.tagName));
  }
  // Normal modda Brave doğru bildiriyor → klavye yüksekliğini orada ÖĞREN.
  // Tam ekranda ise bildirilen düşüşe görünmeyen adres çubuğu da ekleniyor,
  // o yüzden öğrenilen gerçek klavye yüksekliğini kullanıyoruz.
  // En doğru kaynak: VirtualKeyboard API — klavyenin gerçek yüksekliğini verir,
  // tam ekranda da doğru çalışır. Destekliyorsa tahmini yöntemleri hiç kullanmayız.
  const vk=navigator.virtualKeyboard||null;
  if(vk){
    try{vk.overlaysContent=true;}catch(e){}
    vk.addEventListener('geometrychange',()=>{
      if(vkH()>40)vkOk=true;
      q();chaseApply([80,260]);
    });
    // Güvenli bağlam değilse (file://, content://) API ölçüm vermez.
    // Klavye açıldıktan sonra hâlâ 0 ise devre dışı bırakıp tahmine dön.
    addEventListener('focusin',()=>setTimeout(()=>{
      if(!vkOk&&vkH()<=0){try{vk.overlaysContent=false;}catch(e){} vkDead=true; apply();}
    },700));
  }
  function vkH(){const r=vk&&vk.boundingRect;return r?Math.round(r.height):0;}
  let vvBaseN=0;
  function targetH(){
    if(vk&&vkOk&&!vkDead){
      const base=document.fullscreenElement?screen.height:(vv?vv.height:innerHeight);
      return Math.round(base-vkH());
    }
    if(!vv)return innerHeight;
    const fs=!!document.fullscreenElement;
    if(!fs){
      if(!typing())vvBaseN=Math.max(vvBaseN,vv.height);
      const drop=Math.round(Math.max(0,vvBaseN-vv.height));
      if(drop>120&&drop>kbLearned){kbLearned=drop;store.set({kbh:drop});}
      fsOff=drop;
      return Math.round(vv.height);
    }
    if(!typing())vvBase=Math.max(vvBase,vv.height);
    const drop=Math.round(Math.max(0,vvBase-vv.height));
    if(drop<40){fsOff=0;return Math.round(Math.min(vv.height,screen.height));}
    const kb=Math.max(0,(kbLearned>120?kbLearned:drop)-fsAdj);
    fsOff=kb;
    return Math.round(screen.height-kb);
  }
  function apply(){
    raf=0;
    if(!vv)return;
    const b=document.body.style;
    b.height=targetH()+'px';
    b.top=Math.round(vv.offsetTop)+'px';
    if(stick)chat.scrollTop=chat.scrollHeight;
  }
  const q=()=>{if(!raf)raf=requestAnimationFrame(apply);};
  // Klavye animasyonu sürerken gelen tek ölçüm yanlış olabilir; peşine takip ölçümleri koy.
  let chase=[];
  function chaseApply(list){
    chase.forEach(clearTimeout);
    chase=list.map(d=>setTimeout(apply,d));
  }
  if(vv){
    vv.addEventListener('resize',()=>{q();chaseApply([120,320,650]);});
    vv.addEventListener('scroll',q);
  }
  // hangi alana dokunulursa dokunulsun yeniden ölç
  addEventListener('focusin',()=>chaseApply([80,250,500,900]));
  addEventListener('focusout',()=>chaseApply([120,350,700]));
  addEventListener('orientationchange',()=>{vvBase=0;setTimeout(apply,250);});
  // tam ekrana girip çıkışta ölçüm sıfırlansın
  ['fullscreenchange','webkitfullscreenchange'].forEach(ev=>
    addEventListener(ev,()=>{
      vvBase=0;fsOff=0;
      [80,350,750].forEach(d=>setTimeout(apply,d));
    }));
  addEventListener('resize',q);
  // kutuya odaklanınca klavye açılırken son mesajlara in
  // ölçüm hâlâ tutmuyorsa kendini düzelten kısa döngü
  setInterval(()=>{
    if(!vv)return;
    if(Math.abs(parseFloat(document.body.style.height||0)-targetH())>2) apply();
  },500);
  apply();
})();

(function boot(){
  const s=store.get();
  saved=Array.isArray(s.saved)?s.saved:[];
  if(s.ch)$('chan').value=s.ch;if(s.nick)$('nick').value=s.nick;if(s.tok)$('tok').value=s.tok;
  setSkin(s.skin||'msn',true);
  setAccent(s.accent||'#ff9a2e',true);
  kbLearned=Number(s.kbh)||0;fsAdj=Number(s.fsadj)||0;
  if(s.chrome)setChrome(s.chrome,true);
  setNudge(s.nudgeSound!==false,s.nudgeShake!==false,true);
  setAdj(fsAdj);
  applyLang(s.lang||(navigator.language||'').slice(0,2).toLowerCase(),true);
  setFont(s.font||'def',true);setFsize(s.fsize||'1',true);
  setNotify(s.notify||'mention',true);
  setSound(s.sound!==false,true);
  drawChans();setIdentity();
  info(T('startHint'));
})();
